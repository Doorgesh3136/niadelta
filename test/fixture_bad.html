<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QA harness fixture: known violations</title>
<style>body{margin:0;font:16px/1.5 system-ui}main{padding:16px}.wide{width:500px;height:40px;background:#F8B518}.tiny{font-size:10px}.small-btn{width:30px;height:30px}.ghost{opacity:0}.box{width:120px;overflow:hidden;white-space:nowrap}.clipwrap{overflow:hidden;width:100%}.clipwrap div{width:3000px;height:20px;background:#1F8A8A}.spacer{height:2000px}</style></head>
<body><main id="app">
<h1>Fixture</h1>
<p>Inline <a href="#x">text link</a> inside running text should be ignored by the tap check.</p>
<div class="wide">EXPECT outside-viewport + h-overflow</div>
<div class="clipwrap"><div>clipped by ancestor, should NOT be reported</div></div>
<p class="tiny">EXPECT font-size&lt;12</p>
<button class="small-btn">x</button>
<p class="ghost">EXPECT content-hidden in rm</p>
<div class="box">EXPECT text-overflow in a clipped nowrap box</div>
<img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" alt="no dims">
<div class="spacer"></div>
<img src="data:image/gif;base64,R0lGODlhAQABAAAAACw=" width="10" height="10" alt="below fold not lazy">
</main>
<script>console.error('EXPECT console-error');setTimeout(()=>{const d=document.createElement('div');d.style.height='300px';d.textContent='EXPECT cls';document.getElementById('app').prepend(d)},300)</script>
</body></html>
